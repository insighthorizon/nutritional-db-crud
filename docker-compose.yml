# https://docs.docker.com/compose/
# https://hub.docker.com/_/postgres
# https://hub.docker.com/_/adminer

#*This is needed so that our containers will be up again after restart (if they were turned on before the reboot):*
#  $ sudo systemctl enable docker

#Run the docker compose:
# path/containing/docker-compose/$ sudo docker compose up -d

#Adminer: http://localhost:8081
#System: PostgreSQL
#Server: postgres
#Username: nutr_app
#Password: secret
#Database: nutr_db

# docker-compose.yml
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: nutr_db
      POSTGRES_USER: nutr_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql # volume path for database persistence
    networks:
      - nutr-net
    restart: unless-stopped # for auto-start after reboot

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - nutr-net
    restart: unless-stopped # for auto-start after reboot

networks: # Adminer uses this network to reach PostgreSQL
  nutr-net:
    driver: bridge

volumes: # we set up a volume to persist the database
  postgres_data:
