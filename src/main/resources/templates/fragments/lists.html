<!-- template fragments: listing (table) elements that can be reused -->
<!-- (The file isn't used in standalone way.) -->
<!--This version of the project doesn't need this to be defined as fragments, because each fragment is used only once.-->
<!--I had multiple uses before (at multiple pages), but I reduced the number of pages in the application.-->
<!--But if I later extend the project, it will be useful again.-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title></title></head>
<body>

<!--element listing foods with pagination (reusable fragment)-->
<!--The links in anchor elements are sort of complicated because they need to also transmit/preserve the search and sort option previously selected by the user-->
<!--It is based on URL parameters.-->
<!--I have the feeling that this reliance on passing parameters back and forth between client and server is not nice. But I was now focusing on just what I can do with spring boot without any javascript framework in frontend.-->
<div th:fragment="foodList" class="my-3 row justify-content-center">
    <!-- message in the case no foods were found -->
    <h5 class="text-center text-secondary" th:if="${foods.isEmpty()}">No foods were found.</h5>

    <!-- table listing the foods found (if not empty) -->
    <div class="col-auto container" th:if="${!foods.isEmpty()}">
        <table class="table table-bordered caption-top">
            <caption>Nutrition values per 100 g</caption>
            <thead>
            <tr> <!-- table header contains clickable links for sorting by a given attribute -->
                <!-- the ternary operator usage here implements toggle of the sorting order -->
                <th scope="col"><a th:href="@{/foods(page=${currentPageNumber},search=${searchedName},sort='foodId',direction=${sortAttribute == 'foodId' and sortDirection == 'asc' ? 'desc' : 'asc'})}"># id</a></th>
                <th scope="col"><a th:href="@{/foods(page=${currentPageNumber},search=${searchedName},sort='name',direction=${sortAttribute == 'name' and sortDirection == 'asc' ? 'desc' : 'asc'})}">Food name</a></th>
                <th scope="col"><a th:href="@{/foods(page=${currentPageNumber},search=${searchedName},sort='kcal',direction=${sortAttribute == 'kcal' and sortDirection == 'asc' ? 'desc' : 'asc'})}">Energy</a></th>
                <th scope="col"><a th:href="@{/foods(page=${currentPageNumber},search=${searchedName},sort='fats',direction=${sortAttribute == 'fats' and sortDirection == 'asc' ? 'desc' : 'asc'})}">Fat</a></th>
                <th scope="col"><a th:href="@{/foods(page=${currentPageNumber},search=${searchedName},sort='protein',direction=${sortAttribute == 'protein' and sortDirection == 'asc' ? 'desc' : 'asc'})}">Protein</a></th>
                <th scope="col"><a th:href="@{/foods(page=${currentPageNumber},search=${searchedName},sort='carbs',direction=${sortAttribute == 'carbs' and sortDirection == 'asc' ? 'desc' : 'asc'})}">Carbohydrates</a></th>
                <th scope="col" sec:authorize="hasRole('ADMIN')">Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- this is a generic table row which represents one entry in the list of foods -->
            <!-- th:each ensures that a row is generated for each entry in the foods list -->
            <tr th:each="food : ${foods}">
                <td th:text="${food.foodId}"></td>
                <td th:text="${food.name}"></td>
                <td th:text="${food.kcal} + ' kcal'"></td>
                <td th:text="${food.fats} + ' g'"></td>
                <td th:text="${food.protein} + ' g'"></td>
                <td th:text="${food.carbs} + ' g'"></td>
                <td sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{'/foods/edit/' + ${food.foodId}}">Edit</a>
                    |
                    <form th:method="DELETE"
                          th:action="@{'/foods/delete/' + ${food.foodId}}"
                          class="d-inline">
                        <button type="submit"
                                class="btn btn-danger py-0 px-1"
                                onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

<!--        PAGINATION - allows us to jump to the beginning, end or to traverse pages one by one-->
<!--        Each pagination element represents a link to a page (unclickable if we are already at that page)-->
<!--        It is based on the following logic:-->
<!--        - Current page is always present (even if it is empty)-->
<!--        - first page is present when it is not the current page-->
<!--        - last page is present when it is not the current page-->
<!--        - the "previous page" (just before the current page) is present if there is some page between the first and current-->
<!--        - the "next page" (just before the current page) is present if there is some page between the last and current-->
<!--        - "in-betweens" are present if there is even more pages in-between-->
        <ul class="pagination justify-content-center">
            <!-- first page -->
            <li th:if="${currentPageNumber} gt 1" class="page-item">
                <a class="page-link"
                   th:href="@{/foods(page=1,search=${searchedName},sort=${sortAttribute},direction=${sortDirection})}">1</a>
            </li>
            <!-- in-between -->
            <li th:if="${currentPageNumber} gt 3" class="page-item disabled">
                <a class="page-link">...</a>
            </li>
            <!-- previous page -->
            <li th:if="${currentPageNumber gt 2}" class="page-item">
                <a th:href="@{/foods(page=${currentPageNumber - 1},search=${searchedName},sort=${sortAttribute},direction=${sortDirection})}"
                   th:text="${currentPageNumber - 1}" class="page-link"></a>
            </li>
            <!-- current page -->
            <li class="page-item active"><a th:text="${currentPageNumber}" class="page-link" href></a></li>
            <!-- next page -->
            <li th:if="${currentPageNumber + 1} lt ${totalPages}" class="page-item">
                <a th:href="@{/foods(page=${currentPageNumber + 1},search=${searchedName},sort=${sortAttribute},direction=${sortDirection})}"
                   th:text="${currentPageNumber + 1}" class="page-link"></a>
            </li>
            <!-- in-between -->
            <li th:if="${currentPageNumber + 2} lt ${totalPages}" class="page-item disabled">
                <a class="page-link">...</a>
            </li>
            <!-- last page -->
            <li th:if="${currentPageNumber} lt ${totalPages}" class="page-item">
                <a th:href="@{/foods(page=${totalPages},search=${searchedName},sort=${sortAttribute},direction=${sortDirection})}"
                   th:text="${totalPages}" class="page-link"></a>
            </li>
        </ul>
    </div>


</div>


</body>
</html>
